{% extends '../base.html' %}
{% load static %}

{% block title %}Blog - TooNice{% endblock %}

{% block content %}
<div class="container mt-5 text-center">
    <h1>Blog</h1>
    <p class="mb-4">Choose what you want to see</p>

    <div class="d-flex justify-content-center gap-3">
        <a href="{% url 'article_list_view' %}" class="btn btn-lg btn-primary">Articles</a>
        {% if user.is_authenticated %}
            <a href="{% url 'article_my_list' %}" class="btn btn-lg btn-outline-primary">My Articles</a>
        {% else %}
            <a href="{% url 'login' %}?next={% url 'article_my_list' %}" class="btn btn-lg btn-outline-primary">My Articles (login)</a>
        {% endif %}
    </div>
</div>
{% endblock %}
